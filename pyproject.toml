[build-system]
requires = ['setuptools>=68']
build-backend = 'setuptools.build_meta'
[project]
name = 'sesg-net-reproducibility'
version = '0.1.0'
requires-python = '>=3.9'
dependencies = [
  'numpy', 'pandas', 'scikit-learn', 'torch', 'xgboost', 'catboost', 'joblib'
]
[tool.setuptools.packages.find]
where = ['src']
