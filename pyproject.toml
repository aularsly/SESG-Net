[build-system]
requires = ['setuptools>=68']
build-backend = 'setuptools.build_meta'
[project]
name = 'sesg-net-reproducibility'
version = '0.1.0'
requires-python = '>=3.8,<3.12'
dependencies = [
  'numpy==1.24.3',
  'pandas==2.0.3',
  'scikit-learn==1.2.2',
  'torch==2.1.2',
  'xgboost==2.1.4',
  'catboost==1.2.8',
  'joblib==1.4.2'
]
[tool.setuptools.packages.find]
where = ['src']
